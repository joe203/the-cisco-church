services:
  cisco-church:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: cisco-church
    container_name: cisco-church
    restart: unless-stopped
    env_file: .env
    ports:
      - "3060:3000"
    networks:
      - web

networks:
  web:
    external: true
